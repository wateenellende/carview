name: Vehicle catalogue checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifests and JavaScript
        run: node tools/check-vehicles.mjs
      - name: Smoke-test model renderers
        run: node tools/smoke-vehicles.mjs
      - name: Verify detailed Logan geometry and controls
        run: node tools/check-logan.mjs
