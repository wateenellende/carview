<!-- The scene frame: the active theme draws the road/sky/vehicle here. It runs sandboxed (no access to the
     phone, apps or network); it only receives car state from the dashboard and reports where the vehicle is. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; } #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="runtime.js"></script>
</body>
</html>
